plugins {
	id "eclipse"
}

//This applies to all sub-projects as well as the root project
allprojects {
	apply plugin: 'java'
	sourceCompatibility = "17"
	targetCompatibility = "21"
	repositories {
		mavenCentral()
	}
}

//Similarly, this will add configurations items for all sub-projects only.
subprojects {
	version = "1.0"
}

//We want to compile the output of the applications to an output folder.
